name: Snapshot Posizionamento
on:
  schedule:
    - cron: '0 22 15 * *'   # 15 di ogni mese alle 23:00 CET
    - cron: '0 22 28 * *'   # 28 di ogni mese alle 23:00 CET
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama Edge Function snapshot
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/snapshot-posizionamento" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            --fail
